<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="first.css">
</head>
<body>

<header>
    <h1>Welcome to My Portfolio</h1>
</header>

<div class="container">

    <!-- About Section -->
    <section id="about">
        <h2>About Me</h2>
        <p>My name is [Amr]. I am a web developer and designer.</p>
        <img src="195.jpg" alt="Profile Picture" class="profile">
    </section>

    <!-- Projects Section -->
    <section id="projects">
        <h2>My Projects</h2>
        <div class="projects">
            <div class="project">
                <img src="https://via.placeholder.com/200x150" alt="Project 1">
                <h3>Project 1</h3>
                <p>Short description of project 1.</p>
            </div>

            <div class="project">
                <img src="https://via.placeholder.com/200x150" alt="Project 2">
                <h3>Project 2</h3>
                <p>Short description of project 2.</p>
            </div>

            <div class="project">
                <img src="https://via.placeholder.com/200x150" alt="Project 3">
                <h3>Project 3</h3>
                <p>Short description of project 3.</p>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Us</h2>

        <div class="contact-box">
            <button id="contactBtn" class="btn-main">Send Message</button>

            <form id="contactForm" class="hidden" novalidate>
                <input id="name" type="text" placeholder="Your Name" required />
                <input id="email" type="email" placeholder="Your Email" required />
                <input id="phone" type="tel" placeholder="Phone Number" required />
                <textarea id="message" placeholder="Your Message" rows="4" required></textarea>

                <button type="submit" class="btn-main">Submit</button>
            </form>
        </div>
    </section>

</div>

<footer>
    &copy; 2025 All Rights Reserved
</footer>

<script src="java (1).js"></script>

</body>
</html>
